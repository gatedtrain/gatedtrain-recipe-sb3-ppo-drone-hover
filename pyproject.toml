[project]
name = "gatedtrain-recipe-sb3-ppo-drone-hover"
version = "0.1.0"
description = "gatedtrain recipe: stable-baselines3 PPO on gym-pybullet-drones hover (CPU), and its adapter `sb3_ppo` (prototype)."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "The gatedtrain Authors"}]
requires-python = ">=3.12,<3.14"
keywords = ["post-training", "reinforcement-learning", "ppo", "stable-baselines3", "drones", "evaluation", "gatedtrain"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# The adapter is pure Python; the training and evaluation environment is runtime/ (its own pyproject.toml and uv.lock).
dependencies = ["gatedtrain>=0.3,<0.4"]

[project.urls]
Homepage = "https://github.com/gatedtrain/gatedtrain-recipe-sb3-ppo-drone-hover"
Source = "https://github.com/gatedtrain/gatedtrain-recipe-sb3-ppo-drone-hover"
Issues = "https://github.com/gatedtrain/gatedtrain-recipe-sb3-ppo-drone-hover/issues"

[project.entry-points."gatedtrain.adapters"]
sb3_ppo = "gatedtrain_recipe_sb3_ppo_drone_hover.rows:PLUGIN"

[build-system]
requires = ["setuptools>=78"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
